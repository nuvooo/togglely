version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: togglely-mongodb
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    environment:
      MONGO_INITDB_DATABASE: togglely
    volumes:
      - mongodb_data:/data/db
    ports:
      # Local access only; MongoDB runs without authentication
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}) }" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      retries: 30
      start_period: 0s
      start_interval: 1s

  redis:
    image: redis:7-alpine
    container_name: togglely-redis
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: togglely-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: mongodb://mongodb:27017/togglely?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (min. 32 chars, e.g. openssl rand -hex 32)}
      PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Recommended when the instance is publicly reachable before setup
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      SKIP_DB_PUSH: ${SKIP_DB_PUSH:-false}
      # Live change stream limits (CLIENT keys vs. SERVER/SDK keys)
      SSE_MAX_PER_CLIENT_KEY: ${SSE_MAX_PER_CLIENT_KEY:-10000}
      SSE_MAX_PER_CLIENT_IP: ${SSE_MAX_PER_CLIENT_IP:-50}
      SSE_MAX_PER_SERVER_KEY: ${SSE_MAX_PER_SERVER_KEY:-50}
      SSE_MAX_PER_IP: ${SSE_MAX_PER_IP:-20}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: togglely-frontend
    environment:
      - BACKEND_HOST=backend
      - BACKEND_PORT=4000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
  redis_data:
