# SDK requests may carry the API key as ?apiKey=: log the path ($uri)
# without the query string for /sdk/ routes.
log_format togglely_sdk '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status '
                        '$body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;

    # Resolve the backend at request time instead of once at startup: an
    # `upstream` block pins the IP nginx saw when it started, so a recreated
    # backend container (new IP after a deploy) would answer 502 until the
    # frontend is restarted too. A variable in proxy_pass forces a lookup via
    # the resolver. The proxy_pass directives carry no URI part on purpose:
    # the original request URI (path + query) is forwarded unchanged.
    resolver NGINX_RESOLVER valid=10s ipv6=off;
    set $backend_upstream "BACKEND_HOST:BACKEND_PORT";

    # Disable caching for JS/CSS files
    location ~* \.(js|css)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # SDK live stream (Server-Sent Events): no buffering, long-lived.
    # ^~ so no regex location can take over; long-lived connections are not
    # logged (and the query may contain the API key).
    location ^~ /sdk/stream/ {
        access_log off;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location ^~ /sdk/ {
        access_log /var/log/nginx/access.log togglely_sdk;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
