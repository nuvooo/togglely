global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'togglely-backend'
    metrics_path: /metrics
    # /metrics requires the backend's METRICS_TOKEN (disabled in production without it)
    # authorization:
    #   type: Bearer
    #   credentials: <METRICS_TOKEN>
    static_configs:
      - targets: ['host.docker.internal:4000']
        labels:
          service: togglely-backend
